services:
  web:
    build: .
    # APScheduler va SQLite yagona yozuvchi talabi sababli faqat 1 ta worker!
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1
    env_file: .env
    volumes:
      - sqlite_data:/app/dbdata
      - media_data:/app/data
      - static_data:/app/staticfiles
      - backup_data:/app/backups
      - log_data:/app/logs
    environment:
      - DEBUG=False
      - DB_DIR=/app/dbdata
      - BACKUP_DIR=/app/backups
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/data:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  sqlite_data:
  media_data:
  static_data:
  backup_data:
  log_data:
