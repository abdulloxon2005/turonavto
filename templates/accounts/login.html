{% extends 'base.html' %}
{% block title %}Kirish{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card mt-5">
      <div class="card-body p-4">
        <h4 class="card-title mb-3 text-center">{{ CENTER_NAME }}</h4>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Telefon raqami</label>
            <input type="text" name="phone" class="form-control" placeholder="+998901234567" required autofocus value="{{ form.phone.value|default:'' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Parol</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          {% if form.non_field_errors %}
            <div class="text-danger small mb-2">{{ form.non_field_errors }}</div>
          {% endif %}
          <button type="submit" class="btn btn-primary w-100">Kirish</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
