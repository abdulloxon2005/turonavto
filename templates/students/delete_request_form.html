{% extends 'base.html' %}
{% block title %}O'chirishni so'rash{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body p-4">
        <h5 class="card-title mb-3">{{ student.full_name }} — o'chirishni so'rash</h5>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Sabab</label>
            {{ form.reason }}
            {% for e in form.reason.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
          </div>
          <button type="submit" class="btn btn-danger w-100">So'rov yuborish</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
